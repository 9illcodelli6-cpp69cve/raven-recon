name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-webkit2-4.1 bubblewrap
      - name: Python environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-linux.txt -r requirements-dev.txt
      - name: Tests
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

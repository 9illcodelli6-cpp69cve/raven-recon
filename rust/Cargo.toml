[workspace]
members = [
    "raven-core",
    "raven-policy",
    "raven-ipc",
    "raven-sandbox",
    "raven-bridge",
]
resolver = "2"

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.75"
authors       = ["RAVEN Security Research Platform"]
license       = "MIT"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
log         = "0.4"
sha2        = "0.10"
hex         = "0.4"
